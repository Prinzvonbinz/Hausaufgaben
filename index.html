<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Klassen Planer</title><link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiS2xhc3NlbiBQbGFuZXIifQ==">
<style>
*{box-sizing:border-box;font-family:Inter,system-ui}body{margin:0;background:#0A0A0B;color:#fff}
header{position:sticky;top:0;z-index:20;background:rgba(10,10,11,.85);backdrop-filter:blur(20px);border-bottom:1px solid #1E1E22;display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
.hBtn{width:44px;height:44px;border-radius:14px;background:#141417;border:1px solid #222;color:#fff;font-size:18px;cursor:pointer}
.add{background:#fff;color:#000;border:none;padding:12px 18px;border-radius:14px;font-weight:800;cursor:pointer}
.wrap{max-width:780px;margin:0 auto;padding:0 16px 100px}
.search{width:100%;margin:14px 0;background:#141417;border:1px solid #222;border-radius:16px;padding:14px;color:#fff;outline:none}
.calHead{display:flex;justify-content:space-between;align-items:center;margin:16px 0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.dow{color:#555;font-size:11px;text-align:center;letter-spacing:.5px}
.day{background:#131316;border:1px solid #1E1E22;border-radius:18px;min-height:92px;padding:8px;cursor:pointer;transition:.15s}
.day:hover{border-color:#333}.day.today{border-color:#fff}.day.other{opacity:.25}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.dot{width:8px;height:8px;border-radius:50%}
.list{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;padding:16px;border-radius:18px;border:1px solid #222;cursor:pointer}
.item b{font-size:15px}.item span{font-size:12px;color:#888}
.type-Hausaufgabe{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.4)}
.type-Test{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.4)}
.type-Klassenarbeit{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.4)}
.type-Sonstiges{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.4)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(16px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.overlay.open{display:flex}.panel{background:#141417;border:1px solid #26262B;border-radius:24px;padding:22px;width:100%;max-width:480px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.cats button{padding:14px;border-radius:14px;border:1.5px solid #26262B;background:#0A0A0B;color:#fff;font-weight:700;cursor:pointer}
.cats button.active{background:#fff;color:#000;border-color:#fff}
.panel input,.panel textarea{width:100%;background:#0A0A0B;border:1px solid #26262B;border-radius:14px;padding:13px;color:#fff;margin-bottom:10px;outline:none}
.row{display:flex;gap:8px}.row button{flex:1;padding:14px;border-radius:14px;border:none;font-weight:800;cursor:pointer}
.w{background:#fff;color:#000}.d{background:#1E1E22;color:#fff}
</style></head><body>
<header><button class="hBtn" onclick="openS()">☰</button><b id="mTitle"></b><button class="add" onclick="openA()">+ Add</button></header>
<div class="wrap">
<input id="q" class="search" placeholder="Suche Fach, Typ, Datum...">
<div class="calHead"><button class="hBtn" onclick="mv(-1)">‹</button><b id="cLab"></b><button class="hBtn" onclick="mv(1)">›</button></div>
<div class="grid" id="dow"></div><div class="grid" id="days"></div>
<div class="list" id="list"></div>
</div>

<div class="overlay" id="addO"><div class="panel">
<h2 id="fT" style="margin:0">Neuer Termin</h2>
<div class="cats"><button data-t="Hausaufgabe" onclick="pt(this)">Hausaufgabe</button><button data-t="Test" onclick="pt(this)">Test</button><button data-t="Klassenarbeit" onclick="pt(this)">Klassenarbeit</button><button data-t="Sonstiges" onclick="pt(this)">Sonstiges</button></div>
<input id="fach" placeholder="Fach"><input id="datum" type="date"><textarea id="desc" rows="3" placeholder="Beschreibung"></textarea>
<div class="row"><button class="d" onclick="closeA()">Abbrechen</button><button class="w" id="sB" onclick="save()">Add</button></div>
</div></div>

<div class="overlay" id="dayO"><div class="panel"><h2 id="dT"></h2><div id="dL" style="display:flex;flex-direction:column;gap:8px;margin:14px 0"></div>
<button class="w" style="width:100%;padding:14px;border-radius:14px" onclick="openA(document.getElementById('dT').dataset.date)">+ Für diesen Tag</button>
<button class="d" style="width:100%;margin-top:8px;padding:14px;border-radius:14px;border:none" onclick="closeD()">Schließen</button></div></div>

<div class="overlay" id="setO"><div class="panel"><h2 style="margin:0 0 14px">Einstellungen</h2>
<div style="background:#0A0A0B;border:1px solid #222;border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><span>🔔 Push aktivieren</span><button class="w" onclick="enPush()">Aktivieren</button></div>
<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #1E1E22"><span>1 Tag vorher</span><input type="checkbox" id="n1" checked></div>
<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #1E1E22"><span>2 Tage vorher</span><input type="checkbox" id="n2" checked></div>
<div style="display:flex;justify-content:space-between;padding:12px 0"><span>Bei neu/bearbeitet/gelöscht</span><input type="checkbox" id="nN" checked></div>
<button class="d" style="width:100%;margin-top:14px" onclick="closeS()">Fertig</button>
</div></div>

<script>
let cur=new Date();cur.setDate(1);let sel='Hausaufgabe',edit=null,evs=[];
const COL={Hausaufgabe:'#3B82F6',Test:'#F59E0B',Klassenarbeit:'#EF4444',Sonstiges:'#10B981'};
const $=id=>document.getElementById(id);
const API='/api/events';
async function load(){try{const r=await fetch(API);evs=await r.json();}catch{evs=JSON.parse(localStorage.getItem('ev')||'[]');} render();}
function store(){localStorage.setItem('ev',JSON.stringify(evs));}
function render(){
 const y=cur.getFullYear(),m=cur.getMonth();$('cLab').textContent=new Intl.DateTimeFormat('de-DE',{month:'long',year:'numeric'}).format(cur);$('mTitle').textContent=new Intl.DateTimeFormat('de-DE',{month:'short'}).format(cur);
 $('dow').innerHTML=['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<div class=dow>${d}</div>`).join('');
 const f=new Date(y,m,1);let s=f.getDay();s=s===0?6:s-1;const dim=new Date(y,m+1,0).getDate(),dimP=new Date(y,m,0).getDate();let h='';
 for(let i=0;i<42;i++){let n,ds,o=false;if(i<s){n=dimP-s+i+1;ds=new Date(y,m-1,n).toISOString().slice(0,10);o=true;}else if(i>=s+dim){n=i-s-dim+1;ds=new Date(y,m+1,n).toISOString().slice(0,10);o=true;}else{n=i-s+1;ds=new Date(y,m,n).toISOString().slice(0,10);}
  const dE=evs.filter(e=>e.datum===ds);const today=ds===new Date().toISOString().slice(0,10);
  h+=`<div class="day ${today?'today':''} ${o?'other':''}" onclick="openD('${ds}')"><div style="font-weight:800;font-size:13px">${n}</div><div class=dots>${dE.slice(0,6).map(e=>`<div class=dot style="background:${COL[e.type]}"></div>`).join('')}</div></div>`;
 }$('days').innerHTML=h;
 const q=$('q').value.toLowerCase();let fl=evs.filter(e=>!q||e.fach.toLowerCase().includes(q)||e.beschreibung.toLowerCase().includes(q)||e.datum.includes(q)||e.type.toLowerCase().includes(q));fl.sort((a,b)=>a.datum.localeCompare(b.datum));
 $('list').innerHTML=fl.map(e=>`<div class="item type-${e.type}" onclick="ed('${e.id}')"><div style="width:10px;height:10px;border-radius:50%;background:${COL[e.type]}"></div><div style="flex:1"><b>${e.type} - ${e.fach}</b><br><span>${e.datum} • ${e.beschreibung.slice(0,60)||'—'}</span></div><div onclick="event.stopPropagation();del('${e.id}')">🗑️</div></div>`).join('')||'<div style="text-align:center;color:#444;margin-top:30px">Keine Termine</div>';
}
function mv(d){cur.setMonth(cur.getMonth()+d);render();}
function openA(pre){$('addO').classList.add('open');$('fT').textContent=edit?'Bearbeiten':'Neuer Termin';$('sB').textContent=edit?'Speichern':'Add';if(pre)$('datum').value=pre;document.querySelectorAll('.cats button').forEach(b=>b.classList.toggle('active',b.dataset.t===sel));}
function closeA(){ $('addO').classList.remove('open');edit=null;$('fach').value='';$('desc').value='';}
function pt(b){sel=b.dataset.t;document.querySelectorAll('.cats button').forEach(x=>x.classList.remove('active'));b.classList.add('active');}
async function save(){
 const fach=$('fach').value.trim(),datum=$('datum').value,desc=$('desc').value.trim();if(!fach||!datum)return alert('Fach + Datum');
 const p={type:sel,fach,datum,beschreibung:desc};
 if(edit){const i=evs.findIndex(e=>e.id===edit);evs[i]={...evs[i],...p};try{await fetch(API+'/'+edit,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});}catch{} }
 else{try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});const j=await r.json();evs.push(j);}catch{p.id=crypto.randomUUID();evs.push(p);store();}}
 store();closeA();render();
}
function ed(id){const e=evs.find(x=>x.id===id);edit=id;sel=e.type;$('fach').value=e.fach;$('datum').value=e.datum;$('desc').value=e.beschreibung;openA();}
async function del(id){if(!confirm('Löschen?'))return;evs=evs.filter(e=>e.id!==id);store();render();try{await fetch(API+'/'+id,{method:'DELETE'});}catch{}}
function openD(date){$('dayO').classList.add('open');$('dT').textContent=new Date(date).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});$('dT').dataset.date=date;const dE=evs.filter(e=>e.datum===date);$('dL').innerHTML=dE.map(e=>`<div class="item type-${e.type}" onclick="ed('${e.id}');closeD()"><div style="width:10px;height:10px;border-radius:50%;background:${COL[e.type]}"></div><div><b>${e.type} - ${e.fach}</b><br><span>${e.beschreibung||'—'}</span></div></div>`).join('')||'<span style="color:#666">Kein Termin</span>';}
function closeD(){ $('dayO').classList.remove('open');}
function openS(){ $('setO').classList.add('open');}
function closeS(){ $('setO').classList.remove('open');localStorage.setItem('ns',JSON.stringify({n1:$('n1').checked,n2:$('n2').checked}));}
async function enPush(){
 if(!('Notification' in window)) return alert('Geht nicht');
 const p=await Notification.requestPermission(); if(p!=='granted') return;
 const reg=await navigator.serviceWorker.register('/sw.js');
 const sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlBase64ToUint8Array('HIER_PUBLIC_KEY_REIN')});
 await fetch('/api/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sub)});
 alert('Push aktiv!');
}
function urlBase64ToUint8Array(b){const pad='='.repeat((4-b.length%4)%4);const base=(b+pad).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(base);const out=new Uint8Array(raw.length);for(let i=0;i<raw.length;++i)out[i]=raw.charCodeAt(i);return out;}
$('q').addEventListener('input',render);$('datum').value=new Date().toISOString().slice(0,10);
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
load();
</script></body></html>
